name: Combined News Processor

on:
  schedule:
    # Run daily at 8:00 PM GMT+7 (1:00 PM UTC) and 11:00 AM GMT+7 (4:00 AM UTC)
    - cron: '0 13 * * *'  # 8:00 PM GMT+7
    - cron: '0 4 * * *'   # 11:00 AM GMT+7
  workflow_dispatch:  # Allow manual trigger

jobs:
  process-all-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements.txt
        
    - name: Create environment file
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        echo "MONGO_CONNECTION_STRING=${{ secrets.MONGO_CONNECTION_STRING }}" >> .env
        
    - name: Run stock news processor
      run: |
        echo "Starting Stock News Processor..."
        python apps/stock_news_processor.py
        echo "Stock News Processor completed."
        
    - name: Run trending news processor
      run: |
        echo "Starting Trending News Processor..."
        python apps/trending_news_processor.py
        echo "Trending News Processor completed."
        
    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/processed/
        git commit -m "Auto-update all news data" || echo "No changes to commit"
        git push 